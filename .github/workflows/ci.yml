# Radio Dash CI: on every push to main, on pull requests, and by hand.
#  - Unit tests of the helper module (gradle -p tests test, Gradle 8.x and JDK 17 locally)
#  - Lint: shell scripts (shellcheck), release notes present for VERSION; javac warnings fail the build (build.sh)
#  - Build: the whole APK rebuilt like build.ps1 (scripts/build.sh), checked by scripts/verify_apk.sh, kept unsigned
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  APKTOOL_VERSION: 2.10.0
  APKTOOL_SHA256: c0350abbab5314248dfe2ee0c907def4edd14f6faef1f5d372d3d4abd28f0431
  BUILD_TOOLS_VERSION: 34.0.0
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests
        run: gradle -p tests test --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: tests/build/reports/tests/test
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh
      - name: Release notes for VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          test -s "release-notes/v$v.md" || { echo "::error::release-notes/v$v.md is missing"; exit 1; }

  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (API 28, build-tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
      - name: apktool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          echo "$APKTOOL_SHA256  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          echo "APKTOOL=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"
      - name: Build
        run: scripts/build.sh
      - name: Verify
        run: scripts/verify_apk.sh dist/Radio_Dash_unsigned.apk
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-dash-unsigned
          path: dist/Radio_Dash_unsigned.apk
          retention-days: 14
